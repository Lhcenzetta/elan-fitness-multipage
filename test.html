<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        div{
            text-align: center;
            font-size: 3rem;
            width: 90%;
            height: 150px;
            background-color: brown;
            margin: 3px;
        }article{
            display: grid;
            grid-template-columns: repeat(3 ,1fr);
            margin-top: 10%;
        }
         @media (max-width: 700px) {
            article{
                display: grid;
                grid-template-columns: repeat(2 ,1fr);
                grid-template-rows: repeat(3, 1fr);
                margin-top: 10%;
            }
        }
        @media (max-width: 500px) {
            article{
                display: grid;
                grid-template-columns: repeat(1 ,1fr);
                grid-template-rows: repeat(6, 1fr);
                margin-top: 10%;
            }
        }
    </style>
</head>
<article>
        <div>box1</div>
        <div>box2</div>
        <div>box3</div>
        <div>box4</div>
        <div>box5</div>
        <div>box6</div>
</article>
</body>
</html>

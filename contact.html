<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

        content="Élan Fitness, salle de sport à Casablanca : musculation, yoga, cardio et boxe fitness avec des coachs diplômés. Réservez votre cours d'essai gratuit.">
    <title>Élan Fitness | Salle de sport à Casablanca</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        section{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;

        }

        img{
            height: 67%;
            width: 50%;
        }
        .form{
            width: 40%;
            background-color: #FF6B2C;
            height: auto;
            
        }
         .form > h1{
            margin-top: 30px;
         }
        .form > h1 , .form > p {
            text-align: center;
        }
        .form > p{
            font-size: 20px;
        }
        form{
            width: 100%;
            height: auto;
            margin-left: 3%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input{
            width: 94%;
            font-size: 25px;
        }
        button{
            margin-top: 10px;
        }
        textarea{
            width: 94%;
            height: 100px;
        }
        button{
            color: white;
            padding: 5px;
            width: 94%;
            font-size: 25px;
            background-color: rgb(123, 137, 215);
            border: solid 1px white;
            border-radius: 10px;
            margin-bottom: 5px;
        }
        button:hover{
            background-color: blue;
            cursor: pointer;
        }

        @media (max-width: 500px) {
            section{
                width: 100%;
                height: auto;
                display: flex;
                flex-direction: column;
                /* justify-content: center; */
                gap: 20px;
                align-items: center;

        }
        }
    </style>
</head>

    <header class="en-tete">

            <nav aria-label="Navigation principale">

                    <li><a href="about.html">À propos</a></li>
                    <li><a href="programmes.html">Programmes</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>

<main>
    <section>
        <div class="form">
            <h1>Contact Us</h1>
            <p>Fill up the form below</p>
            <form>
                <label>Name:</label>
                <input type="text" required> 

                <label >Email:</label>
                <input type="email" required>
            
                <label >Message:</label>
                <textarea ></textarea>

        </div>

                </div>
    
                <nav aria-label="Navigation du pied de page">
                    <ul class="menu menu-pied">
                        <li><a href="index.html">Accueil</a></li>
                        <li><a href="about.html">À propos</a></li>
                        <li><a href="programmes.html">Programmes</a></li>

            <div class="pied-bas">
